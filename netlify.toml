[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."refresh-windows"]
  schedule = "* * * * *"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/api/home"
  to = "/.netlify/functions/home"
  status = 200

[[redirects]]
  from = "/api/allives"
  to = "/.netlify/functions/list-allives"
  status = 200

[[redirects]]
  from = "/api/allive"
  to = "/.netlify/functions/get-allive"
  status = 200

[[redirects]]
  from = "/api/exhibit"
  to = "/.netlify/functions/exhibit-allive"
  status = 200

[[redirects]]
  from = "/api/caress"
  to = "/.netlify/functions/caress-allive"
  status = 200

[[redirects]]
  from = "/api/snapshot"
  to = "/.netlify/functions/snapshot"
  status = 200

[[redirects]]
  from = "/api/presence"
  to = "/.netlify/functions/presence"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
