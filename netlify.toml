[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/api/create-zero-one"
  to = "/.netlify/functions/create-zero-one"
  status = 200

[[redirects]]
  from = "/api/list-zero-ones"
  to = "/.netlify/functions/list-zero-ones"
  status = 200

[[redirects]]
  from = "/api/tap-zero-one"
  to = "/.netlify/functions/tap-zero-one"
  status = 200

[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200

[[redirects]]
  from = "/api/live-session-start"
  to = "/.netlify/functions/live-session-start"
  status = 200

[[redirects]]
  from = "/api/live-session-end"
  to = "/.netlify/functions/live-session-end"
  status = 200

[[redirects]]
  from = "/api/receive-live-comment"
  to = "/.netlify/functions/receive-live-comment"
  status = 200

[[redirects]]
  from = "/api/list-live-comments"
  to = "/.netlify/functions/list-live-comments"
  status = 200

[[redirects]]
  from = "/api/export-live-cycle"
  to = "/.netlify/functions/export-live-cycle"
  status = 200
